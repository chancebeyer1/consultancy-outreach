# PanelPath — distribution partners & co-founder-adjacent BD.
#
# 2026-08-07: replaces the operator's own consulting LinkedIn campaigns (all paused
# same day). Audience is NOT therapists (PanelPath's customers) — it's the people
# who already have therapist trust and can distribute for a rev-share: mental-health
# billers, practice-building coaches/consultants, group-practice consultants,
# therapist community/newsletter owners, plus credentialing specialists who might
# become an operating partner. Full playbook lives in the PanelPath repo:
# bh-credentialing-desk/outreach/partner-search.md
#
# BD conversations, not volume spray: auto_send stays FALSE — every draft goes
# through the dashboard review queue before anything is sent.

name = "PanelPath Partners (BD)"
slug = "panelpath-partners"
is_default = false
status = "active"

auto_send = false

channels = ["linkedin_connect", "linkedin_dm", "email"]  # 2026-08-10: email leg added (review-first)

landing_url = "https://panelpath.vercel.app"

# --- Founder search (co-founder / operating-partner / distribution-partner venues) ---
# Opts this campaign into the founder-search module (workers/founders_draft + founders_sweep
# → dashboard /founders). Drafts venue-native posts, YC-CFM profile copy, and reachouts from
# this bundle's icp.md + offer.md. Nothing is ever auto-posted — a human pastes every post
# and sends every reachout. See FOUNDERS.md.
founder_search = true

# Discovery keywords the read-only sweep matches against HN who-wants-to-be-hired /
# who-is-hiring comments and new r/cofounder posts. Optional: without this list the sweep
# falls back to the double-quoted marker phrases in icp.md.
founder_keywords = [
    "credentialing",
    "payer enrollment",
    "provider enrollment",
    "behavioral health",
    "mental health",
    "therapist",
    "private practice",
    "medical billing",
    "mental health billing",
    "revenue cycle",
    "digital health",
    "health tech",
    "healthcare",
]

# Skip engineer-profile candidates in discovery (operator covers the technical side);
# ops/sales/healthcare-ops signals override. See _wrong_role in workers/founders_sweep.py.
founder_exclude_engineers = true

# Own comment stream (separate from the consulting AI-agent stream): the daily growth
# digest finds LinkedIn posts matching these and drafts comments in THIS campaign's
# persona, tagged campaign_slug=panelpath-partners in /comments. See workers/growth.py.
growth_keywords = [
    "insurance credentialing",
    "therapist private practice",
    "insurance panels therapist",
    "behavioral health startup",
    "healthtech cofounder",
]
